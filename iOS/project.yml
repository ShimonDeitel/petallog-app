name: Petallog
options:
  bundleIdPrefix: com.shimondeitel.petallog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Petallog:
    type: application
    platform: iOS
    sources:
      - path: Petallog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.petallog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Petallog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  PetallogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PetallogTests
      - path: Petallog.storekit
    dependencies:
      - target: Petallog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.petallog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  PetallogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PetallogUITests
    dependencies:
      - target: Petallog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.petallog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Petallog:
    build:
      targets:
        Petallog: all
        PetallogTests: [test]
        PetallogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Petallog.storekit
    test:
      config: Debug
      storeKitConfiguration: Petallog.storekit
      targets:
        - PetallogTests
        - PetallogUITests
    archive:
      config: Release
